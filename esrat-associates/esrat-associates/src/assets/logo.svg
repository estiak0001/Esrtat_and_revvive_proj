<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Shield / Scale emblem -->
  <g transform="translate(0,8)">
    <!-- Shield shape -->
    <path d="M32 4 L56 12 L56 36 C56 50 44 60 32 64 C20 60 8 50 8 36 L8 12 Z" fill="#0D1B2A" stroke="#C9A84C" stroke-width="2"/>
    <!-- Scale beam -->
    <line x1="32" y1="20" x2="32" y2="44" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="26" x2="46" y2="26" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left scale pan -->
    <path d="M14 32 C14 32 16 38 22 38 C28 38 30 32 30 32 Z" fill="none" stroke="#C9A84C" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="18" y1="26" x2="22" y2="32" stroke="#C9A84C" stroke-width="1.2"/>
    <!-- Right scale pan -->
    <path d="M34 28 C34 28 36 34 42 34 C48 34 50 28 50 28 Z" fill="none" stroke="#C9A84C" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="46" y1="26" x2="42" y2="28" stroke="#C9A84C" stroke-width="1.2"/>
    <!-- Base -->
    <line x1="26" y1="44" x2="38" y2="44" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Text: ESRAT -->
  <text x="68" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="3" fill="white">ESRAT</text>
  <!-- Text: Associates -->
  <text x="69" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" letter-spacing="4" fill="#C9A84C">ASSOCIATES</text>
  <!-- Tagline divider -->
  <line x1="68" y1="62" x2="310" y2="62" stroke="#C9A84C" stroke-width="0.5" opacity="0.5"/>
  <!-- Tagline -->
  <text x="68" y="74" font-family="Arial, sans-serif" font-size="8" font-weight="400" letter-spacing="3" fill="#C9A84C" opacity="0.8">SKILL IS OUR STRENGTH</text>
</svg>
