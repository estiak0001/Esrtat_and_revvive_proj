<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="60%" style="stop-color:#0c1e30"/>
      <stop offset="100%" style="stop-color:#152c44"/>
    </linearGradient>
    <radialGradient id="glow3" cx="72%" cy="50%" r="38%">
      <stop offset="0%" style="stop-color:#C9A84C;stop-opacity:0.13"/>
      <stop offset="100%" style="stop-color:#C9A84C;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="700" fill="url(#bg3)"/>
  <rect width="1440" height="700" fill="url(#glow3)"/>

  <!-- Diagonal lines pattern -->
  <pattern id="diag" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <line x1="0" y1="30" x2="30" y2="0" stroke="#C9A84C" stroke-width="0.3" opacity="0.12"/>
  </pattern>
  <rect width="1440" height="700" fill="url(#diag)"/>

  <!-- City skyline (right side) -->
  <g transform="translate(780, 120)" opacity="0.2">
    <!-- Building 1 - tallest center -->
    <rect x="240" y="0" width="80" height="420" rx="3" stroke="#C9A84C" stroke-width="3" fill="none"/>
    <rect x="252" y="0" width="56" height="30" rx="2" stroke="#C9A84C" stroke-width="2" fill="none"/>
    <!-- Windows B1 -->
    <rect x="255" y="50" width="20" height="25" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="285" y="50" width="20" height="25" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="255" y="100" width="20" height="25" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="285" y="100" width="20" height="25" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="255" y="150" width="20" height="25" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="285" y="150" width="20" height="25" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="255" y="200" width="20" height="25" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="285" y="200" width="20" height="25" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="255" y="250" width="20" height="25" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="285" y="250" width="20" height="25" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="255" y="300" width="20" height="25" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="285" y="300" width="20" height="25" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>

    <!-- Building 2 left tall -->
    <rect x="110" y="80" width="100" height="340" rx="3" stroke="#C9A84C" stroke-width="3" fill="none"/>
    <rect x="125" y="100" width="25" height="30" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="162" y="100" width="25" height="30" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="125" y="155" width="25" height="30" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="162" y="155" width="25" height="30" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="125" y="210" width="25" height="30" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="162" y="210" width="25" height="30" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="125" y="265" width="25" height="30" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="162" y="265" width="25" height="30" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>

    <!-- Building 3 right -->
    <rect x="360" y="110" width="90" height="310" rx="3" stroke="#C9A84C" stroke-width="3" fill="none"/>
    <rect x="374" y="130" width="22" height="28" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="410" y="130" width="22" height="28" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="374" y="182" width="22" height="28" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="410" y="182" width="22" height="28" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="374" y="234" width="22" height="28" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="410" y="234" width="22" height="28" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>

    <!-- Building 4 far left small -->
    <rect x="20" y="200" width="70" height="220" rx="3" stroke="#C9A84C" stroke-width="2.5" fill="none"/>
    <rect x="36" y="218" width="16" height="20" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="60" y="218" width="16" height="20" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="36" y="260" width="16" height="20" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="60" y="260" width="16" height="20" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>

    <!-- Building 5 far right small -->
    <rect x="480" y="220" width="60" height="200" rx="3" stroke="#C9A84C" stroke-width="2.5" fill="none"/>
    <rect x="494" y="238" width="14" height="18" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="516" y="238" width="14" height="18" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="494" y="275" width="14" height="18" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>
    <rect x="516" y="275" width="14" height="18" rx="1" stroke="#C9A84C" stroke-width="1.5" fill="none"/>

    <!-- Ground line -->
    <line x1="0" y1="420" x2="560" y2="420" stroke="#C9A84C" stroke-width="3"/>
